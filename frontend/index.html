<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1F2A30" />
    <title>Notificaciones ANM</title>
    <script>
      // Aplica el tema guardado antes de pintar, para evitar un destello del modo equivocado
      try {
        var t = localStorage.getItem('tema');
        if (t === 'claro') document.documentElement.dataset.theme = 'light';
        if (t === 'oscuro') document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
